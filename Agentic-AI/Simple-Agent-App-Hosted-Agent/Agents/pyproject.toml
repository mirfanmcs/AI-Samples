[project]
name = "simple-agent-hosted"
version = "0.1.0"
description = "Microsoft Foundry hosted support and documentation agent."
requires-python = ">=3.13"
dependencies = [
    "agent-framework-foundry",
    "agent-framework-foundry-hosting>=1.0.0b260813",
    "debugpy",
    "python-dotenv>=1.1.0",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["hosted_agent_definition", "user_functions"]
